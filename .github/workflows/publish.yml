name: Publish NuGet package

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '9.0.x'

      - name: Restore
        run: dotnet restore ./VBImGuiDx9.slnx

      - name: Build
        run: dotnet build ./VBImGuiDx9.slnx -c Release --no-restore

      - name: Pack
        run: dotnet pack ./VBImGuiDx9.vbproj -c Release --no-restore -o ./artifacts

      - name: NuGet login (OIDC)
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: yoshitoranaga

      - name: Publish NuGet package
        run: dotnet nuget push ./artifacts/VBImGuiDx9*.nupkg --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
